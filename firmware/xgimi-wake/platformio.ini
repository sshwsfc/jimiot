; 极米投影仪 BLE 唤醒网关
; 编译：pio run
; 烧录：pio run -t upload            （默认串口 /dev/cu.usbserial-*）
; 串口：pio device monitor
;
; 经典 ESP32（WROOM-32 / DevKit）用默认环境；
; 想用 ESP32-C3 / C6 等 BLE-only 芯片，注释掉 env:esp32dev，改用 env:esp32c3。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
